# Per-repo configuration for scripts/sandbox.sh.
# sandbox.sh and sandbox-prove.sh are byte-identical across TokenBot repos;
# everything that differs between them lives here.

SANDBOX_NAME=tokenbot-cli

# Inputs that decide what gets installed. If any changes, deps are rebuilt.
# Leaving one out means a stale dependency tree gets reused in silence.
SANDBOX_LOCKFILES="package.json package-lock.json .npmrc Dockerfile.sandbox Dockerfile.sandbox.dockerignore"

# Where the image leaves the installed tree, and where sandbox.sh mounts it.
# The container root rather than /work/node_modules: Docker cannot create a
# mountpoint inside the read-only source bind, and Node resolves by walking up
# from the importing file, so /node_modules serves all of /work.
SANDBOX_DEPS_DIR=/deps/node_modules
SANDBOX_MOUNT_DEPS_AT=/node_modules

# Cache directories the toolchain writes INSIDE the read-only dependency tree.
# Each gets a tmpfs mounted over it — writable per-run, discarded at exit. Each
# must also be created in Dockerfile.sandbox: Docker cannot make a mountpoint
# under a read-only mount, and a missing one surfaces as a cryptic
# "ENOENT ... mkdir '/node_modules/.vite-temp'" rather than a clear error.
SANDBOX_SCRATCH_DIRS=".vite-temp .vite .cache"

# Invoked directly rather than through `npm test`, so npm does not try to write
# logs into the read-only source tree.
SANDBOX_DEFAULT_CMD="node /node_modules/vitest/vitest.mjs run --passWithNoTests"

# cli-core, data-models and sdk all come from GitHub Packages. The token reaches
# the build as a BuildKit secret only — never a --build-arg, never an ENV.
SANDBOX_SECRET_NPMRC=1

# The plain host command, printed on every failure path and by `doctor`.
SANDBOX_HOST_CMD="npm test"
